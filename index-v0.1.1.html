<!DOCTYPE html>
<!--
  Florida Foreclosure Surplus Funds Tracker
  File:     index-v0.1.1.html
  Version:  v0.1.1 (test build; not deployed)
  Date:     2026-10-18

  Changelog
  v0.1.1 — 2026-10-18
    - Case form: Case ID, Winning Bid and Report link fields each get an "Open ↗" button
      that opens the link in a new tab; it updates as you type and is disabled when the
      field is blank or not an http(s) link.
  v0.1.0 — 2026-10-18
    - Email/password sign-in, password reset, sign-out (no public sign-up).
    - Firestore storage under users/{uid}/cases and users/{uid}/importBatches.
    - Case list in table and card views; search, filters, A–Z / Z–A sort on every column.
    - Case detail: add, edit, delete; claim status; timestamped notes.
    - Google Sheet import (.xlsx export) with sheet auto-detect, column mapping,
      validation, duplicate preview, and Case ID / Winning Bid / Report hyperlinks.

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surplus Funds Tracker</title>
<style>
:root{
  --bg:#f4f5f2; --surface:#ffffff; --surface-2:#f9faf8; --line:#dfe2dc; --line-strong:#c8ccc4;
  --ink:#1d2320; --ink-2:#4c5650; --ink-3:#7a837d;
  --accent:#1f6f54; --accent-ink:#ffffff; --accent-soft:#e3f1ea;
  --warn:#9a5b00; --warn-soft:#fdf1dc; --err:#b42318; --err-soft:#fde7e5;
  --info:#285a9e; --info-soft:#e5eefb; --muted-soft:#eceee9;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.06);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121614; --surface:#1a1f1c; --surface-2:#202622; --line:#2d3530; --line-strong:#3b453f;
    --ink:#e6ebe7; --ink-2:#b2bbb5; --ink-3:#86908a;
    --accent:#4fb58c; --accent-ink:#0d1a14; --accent-soft:#1d3329;
    --warn:#e3a447; --warn-soft:#382b15; --err:#f2766b; --err-soft:#3a1d1a;
    --info:#82acec; --info-soft:#1c2a3f; --muted-soft:#262d29;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],select,textarea{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
label.f input,label.f select{width:100%}

/* auth */
#auth-view{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px}
.auth-card h1{font-size:20px;margin:0 0 2px}
.auth-card p.sub{margin:0 0 20px;color:var(--ink-3)}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.auth-msg{font-size:13px;min-height:18px}
.auth-msg.err{color:var(--err)} .auth-msg.ok{color:var(--accent)}

/* app shell */
header.top{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
.chip{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--muted-soft);color:var(--ink-2);font-weight:600}
.chip.demo{background:var(--warn-soft);color:var(--warn)}
header.top .spacer{flex:1}
header.top .who{color:var(--ink-3);font-size:13px}
main{padding:16px 20px 60px;max-width:1600px;margin:0 auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}
.stat .k{font-size:12px;color:var(--ink-3)}
.stat .v{font-size:20px;font-weight:700}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:12px}
.toolbar .grow{flex:1 1 220px}
.toolbar label.f{min-width:120px}
.toolbar .actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 11px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

.resultline{font-size:12px;color:var(--ink-3);margin:0 2px 8px}

/* table */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 260px)}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
table.grid th,table.grid td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.grid th{position:sticky;top:0;background:var(--surface-2);font-size:12px;color:var(--ink-2);font-weight:600;z-index:2}
table.grid td.r,table.grid th.r{text-align:right}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover td{background:var(--accent-soft)}
.sortbtn{border:0;background:transparent;cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center;font-weight:600;color:inherit}
.sortbtn .ar{font-size:10px;color:var(--ink-3);width:14px;display:inline-block}
.sortbtn.on .ar{color:var(--accent)}

.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--muted-soft);color:var(--ink-2)}
.tag.sold{background:var(--accent-soft);color:var(--accent)}
.tag.cancelled{background:var(--err-soft);color:var(--err)}
.tag.plaintiff{background:var(--info-soft);color:var(--info)}
.tag.new{background:var(--accent-soft);color:var(--accent)}
.tag.changed{background:var(--warn-soft);color:var(--warn)}
.tag.same{background:var(--muted-soft);color:var(--ink-3)}
.tag.error{background:var(--err-soft);color:var(--err)}
.neg{color:var(--err)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--accent)}
.card .row1{display:flex;justify-content:space-between;gap:8px;align-items:start}
.card .cid{font-weight:700}
.card .meta{font-size:12px;color:var(--ink-3)}
.card .money{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px}
.card .money b{display:block;font-size:14px}
.card .tags{display:flex;gap:6px;flex-wrap:wrap}

.empty{padding:40px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:880px;border:1px solid var(--line)}
.modal.wide{max-width:1200px}
.modal.small{max-width:440px}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:16px;margin:0;flex:1}
.modal .body{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .left{margin-right:auto}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:0}
legend{font-size:12px;font-weight:700;color:var(--ink-2);padding:0 6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.fgrid .span2{grid-column:span 2}
.help{font-size:12px;color:var(--ink-3)}
.err-text{color:var(--err);font-size:12px}

.notes{display:flex;flex-direction:column;gap:8px}
.note{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.note .nmeta{font-size:11px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.note .nmeta .sp{flex:1}
.note .ntext{white-space:pre-wrap;word-break:break-word;margin-top:4px}
.addnote{display:flex;gap:8px;align-items:flex-start}
.linkrow{display:flex;gap:6px;align-items:center}
.linkrow input{flex:1;width:auto}
.linkrow a.btn{text-decoration:none;color:var(--accent);border-color:var(--accent)}
.linkrow a.btn.off{color:var(--ink-3);border-color:var(--line-strong);opacity:.55;pointer-events:none}

details.raw summary{cursor:pointer;font-size:12px;color:var(--ink-2);font-weight:600}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:12px;margin:8px 0 0}
dl.kv dt{color:var(--ink-3)} dl.kv dd{margin:0;word-break:break-all}

/* import */
.steps{display:flex;gap:10px;flex-wrap:wrap}
.drop{border:2px dashed var(--line-strong);border-radius:var(--radius);padding:22px;text-align:center;color:var(--ink-2)}
.summary{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.maplist{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.maplist span{padding:2px 8px;border-radius:6px;background:var(--muted-soft)}
.maplist span.miss{background:var(--err-soft);color:var(--err)}
.maplist span.extra{background:var(--warn-soft);color:var(--warn)}
.prevwrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.prevwrap table.grid tbody tr{cursor:default}
.issues{font-size:12px;white-space:normal;min-width:220px;max-width:360px}
.issues .e{color:var(--err)} .issues .w{color:var(--warn)}
.diff{font-size:12px;white-space:normal;min-width:220px;max-width:380px;color:var(--warn)}
.progress{height:6px;background:var(--muted-soft);border-radius:99px;overflow:hidden}
.progress div{height:100%;background:var(--accent);width:0}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.toast.err{background:var(--err);color:#fff}

@media (max-width:700px){
  header.top{padding:10px 16px;flex-wrap:wrap}
  header.top .who{display:none}
  main{padding:12px 16px 60px}
  .toolbar .actions{margin-left:0;width:100%}
  .fgrid .span2{grid-column:auto}
  .overlay{padding:8px}
}
</style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script type="module">
/* ============================================================

};
const APP_VERSION = "v0.1.1";
const FIREBASE_SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
const DEMO = String(firebaseConfig.apiKey).startsWith("REPLACE");

// <parse-core>
/* ============================================================
   DATA MODEL + PARSING (pure functions, no DOM)
   ============================================================ */
const FL_COUNTIES = ["Alachua","Baker","Bay","Bradford","Brevard","Broward","Calhoun","Charlotte","Citrus","Clay","Collier","Columbia","DeSoto","Dixie","Duval","Escambia","Flagler","Franklin","Gadsden","Gilchrist","Glades","Gulf","Hamilton","Hardee","Hendry","Hernando","Highlands","Hillsborough","Holmes","Indian River","Jackson","Jefferson","Lafayette","Lake","Lee","Leon","Levy","Liberty","Madison","Manatee","Marion","Martin","Miami-Dade","Monroe","Nassau","Okaloosa","Okeechobee","Orange","Osceola","Palm Beach","Pasco","Pinellas","Polk","Putnam","St. Johns","St. Lucie","Santa Rosa","Sarasota","Seminole","Sumter","Suwannee","Taylor","Union","Volusia","Wakulla","Walton","Washington"];

const CLAIM_STATUSES = ["New","Researching","Surplus confirmed","Claimant located","Claimant contacted","Agreement signed","Claim filed","Paid","No surplus","Closed"];

// Sheet columns in Sheet order. type: date | text | money | number
const SHEET_FIELDS = [
  {key:"saleDate",          label:"Sale Date",          type:"date",   aliases:["saledate"]},
  {key:"caseId",            label:"Case ID",            type:"text",   aliases:["caseid","casenumber","caseno"], link:"caseIdUrl"},
  {key:"parcel",            label:"Parcel",             type:"text",   aliases:["parcel","parcelid","folio"]},
  {key:"bidder",            label:"Bidder",             type:"text",   aliases:["bidder"]},
  {key:"winningBid",        label:"Winning Bid",        type:"money",  aliases:["winningbid"], link:"winningBidUrl"},
  {key:"deposit",           label:"Deposit",            type:"money",  aliases:["deposit"]},
  {key:"auctionBalance",    label:"Auction Balance",    type:"money",  aliases:["auctionbalance"]},
  {key:"clerkFee",          label:"Clerk Fee",          type:"money",  aliases:["clerkfee"]},
  {key:"recFee",            label:"Rec Fee",            type:"money",  aliases:["recfee"]},
  {key:"eaFee",             label:"EA Fee",             type:"money",  aliases:["eafee"]},
  {key:"poprFee",           label:"POPR Fee",           type:"money",  aliases:["poprfee"]},
  {key:"docStamps",         label:"Doc Stamps",         type:"money",  aliases:["docstamps"]},
  {key:"totalDue",          label:"Total Due",          type:"money",  aliases:["totaldue"]},
  {key:"auctionStatus",     label:"Auction Status",     type:"text",   aliases:["auctionstatus","status"]},
  {key:"certificateNumber", label:"Certificate Number", type:"text",   aliases:["certificatenumber","certificateno","certnumber"]},
  {key:"surplus",           label:"Surplus",            type:"money",  aliases:["surplus"]},
  {key:"report",            label:"Report",             type:"text",   aliases:["report"], link:"reportUrl"},
  {key:"sequence",          label:"Sequence",           type:"number", aliases:["sequence","seq"]}
];
const REQUIRED_HEADERS = ["saleDate","caseId"];
const MONEY_KEYS = SHEET_FIELDS.filter(f => f.type === "money").map(f => f.key);
const LINK_KEYS = SHEET_FIELDS.filter(f => f.link).map(f => f.link);
// Fields compared when deciding whether a re-imported row has changed
const COMPARE_KEYS = SHEET_FIELDS.map(f => f.key).concat(LINK_KEYS);

function normHeader(s){ return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]/g, ""); }
function stripHtml(s){ return String(s).replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/\s+/g, " ").trim(); }
function normCaseId(s){ return String(s == null ? "" : s).trim().replace(/\s+/g, "").toUpperCase(); }
function caseKey(county, caseId, saleDate){ return [String(county || "").trim().toLowerCase(), normCaseId(caseId), saleDate || ""].join("|"); }
function isHttpUrl(u){ return /^https?:\/\//i.test(String(u || "").trim()); }

function pad2(n){ return (n < 10 ? "0" : "") + n; }
// Excel serial (1900 system) → {y,m,d,hh,mm,ss} wall-clock parts
function serialParts(n){
  const ms = Math.round(n * 86400000);
  const d = new Date(Date.UTC(1899, 11, 30) + ms);
  return {y:d.getUTCFullYear(), m:d.getUTCMonth() + 1, d:d.getUTCDate(), hh:d.getUTCHours(), mm:d.getUTCMinutes(), ss:d.getUTCSeconds()};
}
function serialToISODate(n){ const p = serialParts(n); return p.y + "-" + pad2(p.m) + "-" + pad2(p.d); }
// Wall-clock time in the user's local timezone → UTC ISO string
function serialToLocalISO(n){ const p = serialParts(n); return new Date(p.y, p.m - 1, p.d, p.hh, p.mm, p.ss).toISOString(); }
function validYMD(y, m, d){
  if (y < 1900 || y > 2200 || m < 1 || m > 12 || d < 1 || d > 31) return false;
  const t = new Date(Date.UTC(y, m - 1, d));
  return t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
}
// Accepts 10/15/2026, 10-15-26, 2026-10-15, 101526 (MMDDYY)
function parseDateText(s){
  s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m && validYMD(+m[1], +m[2], +m[3])) return m[1] + "-" + pad2(+m[2]) + "-" + pad2(+m[3]);
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/);
  if (m){
    let y = +m[3]; if (y < 100) y += 2000;
    if (validYMD(y, +m[1], +m[2])) return y + "-" + pad2(+m[1]) + "-" + pad2(+m[2]);
  }
  m = s.match(/^(\d{2})(\d{2})(\d{2})$/);
  if (m && validYMD(2000 + +m[3], +m[1], +m[2])) return (2000 + +m[3]) + "-" + m[1] + "-" + m[2];
  return null;
}
// Money text/number → integer cents. Returns {cents, error}
function parseMoney(v){
  if (v == null || v === "") return {cents:null};
  if (typeof v === "number") return isFinite(v) ? {cents:Math.round(v * 100)} : {cents:null, error:"not a number"};
  let s = String(v).trim();
  if (!s || s === "-" || s === "—") return {cents:null};
  let neg = false;
  if (/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1, -1); }
  s = s.replace(/[$,\s]/g, "");
  if (s.startsWith("-")){ neg = !neg; s = s.slice(1); }
  if (!/^\d+(\.\d+)?$/.test(s)) return {cents:null, error:"\"" + v + "\" is not a dollar amount"};
  const c = Math.round(parseFloat(s) * 100);
  return {cents: neg ? -c : c};
}
function numToText(v){
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : String(v);
  return v == null ? "" : stripHtml(v);
}
// =HYPERLINK("url","label") → url
function hyperlinkFromFormula(f){
  if (!f) return null;
  const m = String(f).match(/HYPERLINK\(\s*"([^"]+)"/i);
  return m ? m[1] : null;
}

// Read one SheetJS cell into {v, t, w, link, formula}
function readCell(ws, XLSX, r, c){
  const cell = ws[XLSX.utils.encode_cell({r, c})];
  if (!cell) return null;
  let link = cell.l && cell.l.Target ? String(cell.l.Target) : null;
  if (!link) link = hyperlinkFromFormula(cell.f);
  if (link) link = link.replace(/&amp;/g, "&").replace(/&quot;/g, "\"").replace(/&#39;/g, "'").trim();
  if (link && !isHttpUrl(link)) link = null;
  return {v: cell.v, t: cell.t, w: cell.w != null ? String(cell.w) : (cell.v == null ? "" : String(cell.v)), z: cell.z, link, formula: cell.f || null};
}
function cellIsDate(cell, XLSX){
  if (!cell || cell.t !== "n") return cell && cell.t === "d";
  if (cell.z && XLSX.SSF && XLSX.SSF.is_date) { try { return XLSX.SSF.is_date(cell.z); } catch(e) {} }
  return /[dmy]/i.test(String(cell.z || "")) && !/[#0]/.test(String(cell.z || ""));
}

// Find header row (first 10 rows) and map columns → field keys
function findHeader(ws, XLSX){
  if (!ws || !ws["!ref"]) return null;
  const range = XLSX.utils.decode_range(ws["!ref"]);
  const maxR = Math.min(range.e.r, range.s.r + 9);
  let best = null;
  for (let r = range.s.r; r <= maxR; r++){
    const mapping = {}; const extra = []; const headers = {};
    for (let c = range.s.c; c <= range.e.c; c++){
      const cell = readCell(ws, XLSX, r, c);
      if (!cell || cell.w === "") continue;
      const h = normHeader(cell.w);
      headers[c] = String(cell.w).replace(/\s+/g, " ").trim();
      const f = SHEET_FIELDS.find(x => x.aliases.includes(h));
      if (f && mapping[f.key] == null) mapping[f.key] = c;
      else extra.push(headers[c]);
    }
    const score = Object.keys(mapping).length;
    if (!best || score > best.score) best = {row:r, mapping, extra, headers, score, range};
  }
  return best;
}

// Rank sheets: report sheets first, by number of recognised columns
function rankSheets(wb, XLSX){
  return wb.SheetNames.map(name => {
    const ws = wb.Sheets[name];
    const h = findHeader(ws, XLSX);
    const isNotes = !!h && notesHeader(ws, XLSX) != null;
    return {name, score: h ? h.score : 0, hasRequired: !!h && REQUIRED_HEADERS.every(k => h.mapping[k] != null), isNotes};
  }).sort((a, b) => b.score - a.score);
}

function parseCaseSheet(ws, XLSX){
  const h = findHeader(ws, XLSX);
  if (!h) return {error:"This sheet is empty."};
  const missing = SHEET_FIELDS.filter(f => h.mapping[f.key] == null).map(f => f.label);
  const missingRequired = REQUIRED_HEADERS.filter(k => h.mapping[k] == null).map(k => SHEET_FIELDS.find(f => f.key === k).label);
  const rows = [];
  for (let r = h.row + 1; r <= h.range.e.r; r++){
    const cells = {};
    let any = false;
    for (const f of SHEET_FIELDS){
      const c = h.mapping[f.key];
      const cell = c == null ? null : readCell(ws, XLSX, r, c);
      cells[f.key] = cell;
      if (cell && cell.w.trim() !== "") any = true;
    }
    if (!any) continue;
    rows.push(parseCaseRow(cells, r + 1, XLSX));
  }
  return {headerRow: h.row + 1, mapping: h.mapping, missing, missingRequired, extra: h.extra, rows};
}

function parseCaseRow(cells, rowNumber, XLSX){
  const data = {}; const raw = {}; const errors = []; const warnings = [];
  for (const f of SHEET_FIELDS){
    const cell = cells[f.key];
    raw[f.key] = cell ? cell.w : "";
    if (f.link) data[f.link] = cell && cell.link ? cell.link : null;
    const empty = !cell || (cell.v == null || String(cell.v).trim() === "");
    if (f.type === "date"){
      if (empty){ data[f.key] = null; continue; }
      let iso = null;
      if (cell.t === "n") iso = serialToISODate(cell.v);
      else if (cell.t === "d" && cell.v instanceof Date) iso = cell.v.toISOString().slice(0, 10);
      else iso = parseDateText(cell.w || cell.v);
      if (!iso) errors.push(f.label + ": can't read date \"" + raw[f.key] + "\"");
      data[f.key] = iso;
    } else if (f.type === "money"){
      const p = empty ? {cents:null} : parseMoney(cell.t === "n" ? cell.v : cell.w);
      if (p.error) errors.push(f.label + ": " + p.error);
      data[f.key] = p.cents;
    } else if (f.type === "number"){
      if (empty){ data[f.key] = null; continue; }
      const n = typeof cell.v === "number" ? cell.v : parseFloat(String(cell.w).replace(/,/g, ""));
      if (!isFinite(n)){ warnings.push(f.label + ": \"" + raw[f.key] + "\" is not a number (kept as blank)"); data[f.key] = null; }
      else data[f.key] = n;
    } else {
      data[f.key] = empty ? "" : numToText(cell.t === "n" ? cell.v : cell.w);
    }
  }
  if (!data.caseId) errors.push("Case ID is blank");
  if (!data.saleDate && !errors.some(e => e.startsWith("Sale Date"))) errors.push("Sale Date is blank");
  if (data.caseId && !data.caseIdUrl) warnings.push("Case ID has no hyperlink");
  if (!data.parcel) warnings.push("Parcel is blank");
  if (data.surplus == null && data.winningBid != null && data.totalDue != null){
    data.surplus = data.winningBid - data.totalDue;
    warnings.push("Surplus was blank; calculated as Winning Bid − Total Due");
  } else if (data.surplus != null && data.winningBid != null && data.totalDue != null && Math.abs(data.surplus - (data.winningBid - data.totalDue)) > 1){
    warnings.push("Surplus doesn't equal Winning Bid − Total Due");
  }
  return {rowNumber, data, raw, errors, warnings};
}

// ---- Notes tab: IDNotes | Note | Created | Modified | Case ID
function notesHeader(ws, XLSX){
  if (!ws || !ws["!ref"]) return null;
  const range = XLSX.utils.decode_range(ws["!ref"]);
  const map = {};
  for (let c = range.s.c; c <= range.e.c; c++){
    const cell = readCell(ws, XLSX, range.s.r, c);
    if (!cell) continue;
    const h = normHeader(cell.w);
    if (h === "idnotes" || h === "noteid" || h === "id") map.id = c;
    else if (h === "note" || h === "notes") map.text = c;
    else if (h === "created" || h === "createdat") map.created = c;
    else if (h === "modified" || h === "updated" || h === "modifiedat") map.modified = c;
    else if (h === "caseid") map.caseId = c;
  }
  return (map.text != null && map.caseId != null) ? {map, range} : null;
}
function cellToLocalISO(cell){
  if (!cell || cell.v == null || cell.v === "") return null;
  if (cell.t === "n") return serialToLocalISO(cell.v);
  if (cell.t === "d" && cell.v instanceof Date) return cell.v.toISOString();
  const d = parseDateText(cell.w);
  if (d) return new Date(d + "T00:00:00").toISOString();
  const t = Date.parse(cell.w);
  return isNaN(t) ? null : new Date(t).toISOString();
}
function parseNotesSheet(ws, XLSX){
  const h = notesHeader(ws, XLSX);
  if (!h) return [];
  const out = [];
  for (let r = h.range.s.r + 1; r <= h.range.e.r; r++){
    const get = k => h.map[k] == null ? null : readCell(ws, XLSX, r, h.map[k]);
    const text = get("text"); const cid = get("caseId");
    if (!text || !String(text.w).trim()) continue;
    const created = cellToLocalISO(get("created"));
    const modified = cellToLocalISO(get("modified"));
    const idc = get("id");
    out.push({
      rowNumber: r + 1,
      legacyId: idc ? String(idc.w).trim() : "",
      text: String(text.v != null ? text.v : text.w).trim(),
      caseId: cid ? String(cid.w).trim() : "",
      createdAt: created,
      updatedAt: modified || created
    });
  }
  return out;
}

// ---- Duplicate classification
function diffCase(existing, incoming){
  const changed = [];
  for (const k of COMPARE_KEYS){
    const a = existing[k] == null || existing[k] === "" ? null : existing[k];
    const b = incoming[k] == null || incoming[k] === "" ? null : incoming[k];
    if (a !== b) changed.push(k);
  }
  return changed;
}
function classifyRows(rows, county, existingCases){
  const byKey = new Map();
  for (const c of existingCases) byKey.set(c.caseKey || caseKey(c.county, c.caseId, c.saleDate), c);
  const seen = new Map();
  return rows.map(row => {
    const item = {row, key:null, status:"new", existing:null, changed:[], include:false};
    if (row.errors.length){ item.status = "error"; return item; }
    item.key = caseKey(county, row.data.caseId, row.data.saleDate);
    if (seen.has(item.key)){
      item.status = "error";
      row.errors.push("Duplicate of row " + seen.get(item.key) + " in this file");
      return item;
    }
    seen.set(item.key, row.rowNumber);
    const ex = byKey.get(item.key);
    if (ex){
      item.existing = ex;
      item.changed = diffCase(ex, row.data);
      item.status = item.changed.length ? "changed" : "same";
    }
    item.include = item.status === "new";
    return item;
  });
}

function clean(obj){ return JSON.parse(JSON.stringify(obj, (k, v) => v === undefined ? null : v)); }
function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, ch => { const r = Math.random() * 16 | 0; return (ch === "x" ? r : (r & 3 | 8)).toString(16); })); }
function nowISO(){ return new Date().toISOString(); }

function makeDemoStore(){
  const KEY = "sft-demo-v1";
  let mem = {cases:{}, importBatches:{}};
  try { const s = localStorage.getItem(KEY); if (s) mem = JSON.parse(s); } catch(e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e) {} };
  let user = null; let cb = () => {};
  try { const u = sessionStorage.getItem(KEY + "-user"); if (u) user = JSON.parse(u); } catch(e) {}
  return {
    onAuth(fn){ cb = fn; setTimeout(() => cb(user), 0); },
    async signIn(email){ user = {uid:"demo", email}; try { sessionStorage.setItem(KEY + "-user", JSON.stringify(user)); } catch(e) {} cb(user); },
    async signOut(){ user = null; try { sessionStorage.removeItem(KEY + "-user"); } catch(e) {} cb(null); },
    async resetPassword(){ throw new Error("Password reset isn't available in demo mode."); },
    async listCases(){ return Object.values(mem.cases).map(c => clean(c)); },
    async saveCase(c){ mem.cases[c.id] = clean(c); persist(); },
    async deleteCase(id){ delete mem.cases[id]; persist(); },
    async commit(ops, onProgress){
      ops.forEach((op, i) => { mem[op.coll][op.id] = clean(op.data); if (onProgress) onProgress(i + 1, ops.length); });
      persist();
    }
  };
}

async function makeFirebaseStore(){
  const [appM, authM, fsM] = await Promise.all([
    import(FIREBASE_SDK + "firebase-app.js"),
    import(FIREBASE_SDK + "firebase-auth.js"),
    import(FIREBASE_SDK + "firebase-firestore.js")
  ]);
  const app = appM.initializeApp(firebaseConfig);
  const auth = authM.getAuth(app);
  const db = fsM.getFirestore(app);
  const uid = () => { if (!auth.currentUser) throw new Error("Not signed in."); return auth.currentUser.uid; };
  return {
    onAuth(fn){ authM.onAuthStateChanged(auth, u => fn(u ? {uid:u.uid, email:u.email} : null)); },
    signIn(email, pw){ return authM.signInWithEmailAndPassword(auth, email, pw); },
    signOut(){ return authM.signOut(auth); },
    resetPassword(email){ return authM.sendPasswordResetEmail(auth, email); },
    async listCases(){
      const snap = await fsM.getDocs(fsM.collection(db, "users", uid(), "cases"));
      return snap.docs.map(d => d.data());
    },
    saveCase(c){ return fsM.setDoc(fsM.doc(db, "users", uid(), "cases", c.id), clean(c)); },
    deleteCase(id){ return fsM.deleteDoc(fsM.doc(db, "users", uid(), "cases", id)); },
    async commit(ops, onProgress){
      const CHUNK = 400;
      for (let i = 0; i < ops.length; i += CHUNK){
        const batch = fsM.writeBatch(db);
        ops.slice(i, i + CHUNK).forEach(op => batch.set(fsM.doc(db, "users", uid(), op.coll, op.id), clean(op.data)));
        await batch.commit();
        if (onProgress) onProgress(Math.min(i + CHUNK, ops.length), ops.length);
      }
    }
  };
}

function friendlyAuthError(e){
  const code = (e && e.code) || "";
  if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")) return "Email or password is incorrect.";
  if (code.includes("too-many-requests")) return "Too many attempts. Wait a few minutes and try again.";
  if (code.includes("invalid-email")) return "That email address isn't valid.";
  if (code.includes("network")) return "Network error. Check your connection.";
  if (code.includes("api-key") || code.includes("configuration")) return "Firebase config is wrong. Check the firebaseConfig block in the HTML file.";
  if (code.includes("operation-not-allowed")) return "Email/Password sign-in isn't enabled in Firebase Authentication.";
  return (e && e.message) || "Something went wrong.";
}
function friendlyDataError(e){
  const code = (e && e.code) || "";
  if (code.includes("permission-denied")) return "Firestore denied access. Check that the security rules from firestore.rules are published.";
  if (code.includes("unavailable")) return "Firestore is unreachable. Check your connection.";
  return (e && e.message) || "Something went wrong.";
}

const $ = sel => document.querySelector(sel);
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch])); }
const USD = new Intl.NumberFormat("en-US", {style:"currency", currency:"USD"});
function fmtMoney(c){ return c == null ? "" : USD.format(c / 100); }
function moneyCell(c){ return c == null ? "" : (c < 0 ? "<span class=\"neg\">" + fmtMoney(c) + "</span>" : fmtMoney(c)); }
function fmtDate(iso){
  if (!iso) return "";
  const p = String(iso).split("-");
  return p.length === 3 ? (+p[1]) + "/" + (+p[2]) + "/" + p[0] : esc(iso);
}
function fmtDateTime(iso){
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString("en-US", {month:"numeric", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit"});
}
function centsToInput(c){ return c == null ? "" : (c / 100).toFixed(2); }
function safeLink(url, text){
  if (!isHttpUrl(url)) return esc(text);
  return "<a href=\"" + esc(url) + "\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.stopPropagation()\">" + esc(text) + "</a>";
}
function isPlaintiff(c){ return /plaintiff/i.test(c.bidder || ""); }
function statusTag(s){
  if (!s) return "";
  const cls = /sold/i.test(s) ? "sold" : (/cancel/i.test(s) ? "cancelled" : "");

function openModal(html, cls){
  const root = $("#modal-root");
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = "<div class=\"modal " + (cls || "") + "\" role=\"dialog\" aria-modal=\"true\">" + html + "</div>";
  root.appendChild(ov);
  ov.addEventListener("mousedown", e => { if (e.target === ov && !ov.dataset.busy) closeModal(ov); });
  const first = ov.querySelector("input,select,textarea,button");
  if (first) setTimeout(() => first.focus(), 30);
  return ov;
}
function closeModal(ov){ if (ov && ov.parentNode) ov.parentNode.removeChild(ov); }
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const all = document.querySelectorAll("#modal-root .overlay");
  const top = all[all.length - 1];
  if (top && !top.dataset.busy) closeModal(top);
});
// In-app confirm (no browser dialogs)
function confirmBox(title, message, okLabel, danger){
  return new Promise(resolve => {
    const ov = openModal(
      "<header><h2>" + esc(title) + "</h2></header>" +
      "<div class=\"body\"><div>" + esc(message) + "</div></div>" +
      "<footer><button class=\"btn\" data-a=\"no\">Cancel</button><button class=\"btn " + (danger ? "danger" : "primary") + "\" data-a=\"yes\">" + esc(okLabel || "OK") + "</button></footer>",
      "small");
    ov.querySelector("[data-a=no]").onclick = () => { closeModal(ov); resolve(false); };
    ov.querySelector("[data-a=yes]").onclick = () => { closeModal(ov); resolve(true); };
  });
}

  view:"table",

};
try { const v = localStorage.getItem("sft-view"); if (v === "cards" || v === "table") state.view = v; } catch(e) {}

// Table columns: every Sheet field + County, Claim Status, Notes
const TABLE_COLS = [
  {key:"saleDate", label:"Sale Date"},
  {key:"caseId", label:"Case ID"},
  {key:"county", label:"County"},
  {key:"parcel", label:"Parcel"},
  {key:"bidder", label:"Bidder"},
  {key:"winningBid", label:"Winning Bid", money:true},
  {key:"deposit", label:"Deposit", money:true},
  {key:"auctionBalance", label:"Auction Balance", money:true},
  {key:"clerkFee", label:"Clerk Fee", money:true},
  {key:"recFee", label:"Rec Fee", money:true},
  {key:"eaFee", label:"EA Fee", money:true},
  {key:"poprFee", label:"POPR Fee", money:true},
  {key:"docStamps", label:"Doc Stamps", money:true},
  {key:"totalDue", label:"Total Due", money:true},
  {key:"surplus", label:"Surplus", money:true},
  {key:"auctionStatus", label:"Auction Status"},
  {key:"claimStatus", label:"Claim Status"},
  {key:"certificateNumber", label:"Certificate Number"},
  {key:"report", label:"Report"},
  {key:"sequence", label:"Sequence", num:true},
  {key:"notesCount", label:"Notes", num:true}
];

function sortValue(c, key){
  if (key === "notesCount") return (c.notes || []).length;
  return c[key];
}
function compare(a, b, key){
  const va = sortValue(a, key), vb = sortValue(b, key);
  const ea = va == null || va === "", eb = vb == null || vb === "";
  if (ea && eb) return 0;
  if (ea) return 1;
  if (eb) return -1;
  if (typeof va === "number" && typeof vb === "number") return va - vb;
  return String(va).localeCompare(String(vb), "en", {numeric:true, sensitivity:"base"});
}

function filteredCases(){
  const f = state.filters;
  const q = f.search.trim().toLowerCase();
  const min = f.minSurplus.trim() ? parseMoney(f.minSurplus).cents : null;
  let list = state.cases.filter(c => {
    if (f.county && c.county !== f.county) return false;
    if (f.astatus && (c.auctionStatus || "") !== f.astatus) return false;
    if (f.cstatus && (c.claimStatus || "") !== f.cstatus) return false;
    if (f.from && (!c.saleDate || c.saleDate < f.from)) return false;
    if (f.to && (!c.saleDate || c.saleDate > f.to)) return false;
    if (min != null && (c.surplus == null || c.surplus < min)) return false;
    if (f.bidder === "plaintiff" && !isPlaintiff(c)) return false;
    if (f.bidder === "third" && isPlaintiff(c)) return false;
    if (q){
      const hay = [c.caseId, c.parcel, c.bidder, c.auctionStatus, c.claimStatus, c.certificateNumber, c.report, c.county]
        .concat((c.notes || []).map(n => n.text)).join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const {key, dir} = state.sort;
  list.sort((a, b) => {
    const r = compare(a, b, key);
    // Blanks stay last in both directions
    const va = sortValue(a, key), vb = sortValue(b, key);
    if (va == null || va === "" || vb == null || vb === "") return r;
    return dir === "asc" ? r : -r;
  });
  return list;
}

  el.innerHTML = state.view === "table" ? tableHTML(list) : cardsHTML(list);
}

function cellHTML(c, col){
  const v = c[col.key];
  switch (col.key){
    case "saleDate": return fmtDate(v);
    case "caseId": return "<b>" + safeLink(c.caseIdUrl, v) + "</b>";
    case "winningBid": return isHttpUrl(c.winningBidUrl) ? safeLink(c.winningBidUrl, fmtMoney(v)) : fmtMoney(v);
    case "surplus": return moneyCell(v);
    case "auctionStatus": return statusTag(v);
    case "claimStatus": return v ? "<span class=\"tag\">" + esc(v) + "</span>" : "";
    case "report": return safeLink(c.reportUrl, v);
    case "notesCount": return (c.notes || []).length || "";
    default: return col.money ? moneyCell(v) : esc(v);
  }
}
function sortHeader(col){
  const on = state.sort.key === col.key;
  const arrow = on ? (state.sort.dir === "asc" ? "▲" : "▼") : "↕";
  const title = on ? (state.sort.dir === "asc" ? "Sorted A–Z / low–high. Click for Z–A." : "Sorted Z–A / high–low. Click for A–Z.") : "Sort by " + col.label;
  return "<th class=\"" + (col.money || col.num ? "r" : "") + "\"><button class=\"sortbtn" + (on ? " on" : "") + "\" data-sort=\"" + col.key + "\" title=\"" + esc(title) + "\">" + esc(col.label) + "<span class=\"ar\">" + arrow + "</span></button></th>";
}
function tableHTML(list){
  const head = "<tr>" + TABLE_COLS.map(sortHeader).join("") + "</tr>";
  const body = list.map(c => "<tr data-id=\"" + esc(c.id) + "\">" +
    TABLE_COLS.map(col => "<td class=\"" + (col.money || col.num ? "r num" : "") + "\">" + cellHTML(c, col) + "</td>").join("") + "</tr>").join("");
  return "<div class=\"tablewrap\"><table class=\"grid\"><thead>" + head + "</thead><tbody>" + body + "</tbody></table></div>";
}
function cardsHTML(list){
  const sortBar = "<div class=\"toolbar\" style=\"margin-bottom:10px\"><span class=\"help\">Sort cards:</span>" +
    TABLE_COLS.filter(c => ["saleDate","caseId","surplus","winningBid","totalDue","auctionStatus","claimStatus","county","sequence"].includes(c.key))
      .map(col => {
        const on = state.sort.key === col.key;
        return "<button class=\"btn sm sortbtn" + (on ? " on" : "") + "\" data-sort=\"" + col.key + "\">" + esc(col.label) + " <span class=\"ar\">" + (on ? (state.sort.dir === "asc" ? "▲" : "▼") : "↕") + "</span></button>";
      }).join("") + "</div>";
  const cards = list.map(c => {
    const tags = [statusTag(c.auctionStatus)];
    if (isPlaintiff(c)) tags.push("<span class=\"tag plaintiff\">Plaintiff bid</span>");
    if (c.claimStatus) tags.push("<span class=\"tag\">" + esc(c.claimStatus) + "</span>");
    const n = (c.notes || []).length;
    if (n) tags.push("<span class=\"tag\">" + n + " note" + (n > 1 ? "s" : "") + "</span>");
    return "<div class=\"card\" data-id=\"" + esc(c.id) + "\" tabindex=\"0\">" +
      "<div class=\"row1\"><div><div class=\"cid\">" + safeLink(c.caseIdUrl, c.caseId) + "</div><div class=\"meta\">" + esc(c.county) + " · Sale " + fmtDate(c.saleDate) + "</div></div>" +
      "<div class=\"meta\">#" + esc(c.sequence == null ? "" : c.sequence) + "</div></div>" +
      "<div class=\"meta\">Parcel " + esc(c.parcel || "—") + " · Bidder " + esc(c.bidder || "—") + "</div>" +
      "<div class=\"money num\"><div>Winning bid<b>" + fmtMoney(c.winningBid) + "</b></div><div>Total due<b>" + fmtMoney(c.totalDue) + "</b></div><div>Surplus<b>" + moneyCell(c.surplus) + "</b></div></div>" +
      "<div class=\"tags\">" + tags.join("") + "</div></div>";
  }).join("");
  return sortBar + "<div class=\"cards\">" + cards + "</div>";
}

$("#list").addEventListener("click", e => {
  const sb = e.target.closest("[data-sort]");
  if (sb){
    const k = sb.dataset.sort;
    if (state.sort.key === k) state.sort.dir = state.sort.dir === "asc" ? "desc" : "asc";
    else state.sort = {key:k, dir:"asc"};
    renderList(); return;
  }
  const row = e.target.closest("[data-id]");
  if (row && !e.target.closest("a")) openCase(row.dataset.id);
});
$("#list").addEventListener("keydown", e => {
  if (e.key === "Enter"){ const card = e.target.closest(".card[data-id]"); if (card) openCase(card.dataset.id); }
});

/* ============================================================
   DATA LOAD — full reload after every write
   ============================================================ */
async function reload(){
  try {
    state.cases = await state.store.listCases();
  } catch(e){ toast(friendlyDataError(e), true); state.cases = []; }
  refreshFilterOptions();
  renderList();
}

/* ============================================================
   CASE DETAIL / EDIT
   ============================================================ */
function blankCase(){
  const c = {id:uuid(), county:"Miami-Dade", claimStatus:"New", notes:[], raw:{}, source:{type:"manual"}, createdAt:nowISO(), updatedAt:nowISO()};
  SHEET_FIELDS.forEach(f => { c[f.key] = f.type === "text" ? "" : null; });
  LINK_KEYS.forEach(k => { c[k] = null; });
  return c;
}

function fieldInput(f, c){
  const id = "e-" + f.key;
  let input;
  if (f.type === "date") input = "<input id=\"" + id + "\" type=\"date\" value=\"" + esc(c[f.key] || "") + "\">";
  else if (f.type === "money") input = "<input id=\"" + id + "\" type=\"text\" inputmode=\"decimal\" class=\"num\" value=\"" + esc(centsToInput(c[f.key])) + "\">";
  else if (f.type === "number") input = "<input id=\"" + id + "\" type=\"text\" inputmode=\"numeric\" value=\"" + esc(c[f.key] == null ? "" : c[f.key]) + "\">";
  else if (f.key === "auctionStatus") input = "<input id=\"" + id + "\" type=\"text\" list=\"astatus-list\" value=\"" + esc(c[f.key] || "") + "\">";
  else input = "<input id=\"" + id + "\" type=\"text\" value=\"" + esc(c[f.key] || "") + "\">";
  return "<label class=\"f\">" + esc(f.label) + (f.key === "caseId" || f.key === "saleDate" ? " *" : "") + input + "</label>";
}

// Link input + "Open" button (button state kept in sync by syncLinkButtons)
function linkFieldHTML(key, label, value){
  return "<div class=\"f span2\" style=\"display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)\">" +
    "<label for=\"e-" + key + "\">" + esc(label) + "</label>" +
    "<div class=\"linkrow\"><input id=\"e-" + key + "\" type=\"text\" placeholder=\"https://…\" value=\"" + esc(value || "") + "\">" +
    "<a class=\"btn sm\" id=\"o-" + key + "\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Open in a new tab\">Open ↗</a></div></div>";
}
function syncLinkButtons(q){
  LINK_KEYS.forEach(k => {
    const v = q("#e-" + k).value.trim();
    const a = q("#o-" + k);
    if (isHttpUrl(v)){ a.href = v; a.removeAttribute("aria-disabled"); a.classList.remove("off"); a.tabIndex = 0; }
    else { a.removeAttribute("href"); a.setAttribute("aria-disabled", "true"); a.classList.add("off"); a.tabIndex = -1; }
  });
}

function notesHTML(c){
  const notes = (c.notes || []).slice().sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
  if (!notes.length) return "<div class=\"help\">No notes yet.</div>";
  return notes.map(n => "<div class=\"note\" data-nid=\"" + esc(n.id) + "\">" +
    "<div class=\"nmeta\"><span>" + esc(fmtDateTime(n.createdAt)) + (n.updatedAt && n.updatedAt !== n.createdAt ? " · edited " + esc(fmtDateTime(n.updatedAt)) : "") + "</span><span class=\"sp\"></span>" +
    "<button class=\"btn ghost sm\" data-nedit=\"" + esc(n.id) + "\">Edit</button><button class=\"btn ghost sm\" data-ndel=\"" + esc(n.id) + "\">Delete</button></div>" +
    "<div class=\"ntext\">" + linkify(n.text) + "</div></div>").join("");
}
function linkify(text){
  return esc(text).replace(/https?:\/\/[^\s<]+/g, u => "<a href=\"" + u + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + u + "</a>");
}

function openCase(id){
  const existing = state.cases.find(c => c.id === id);
  const isNew = !existing;
  const c = existing ? JSON.parse(JSON.stringify(existing)) : blankCase();
  c.notes = c.notes || [];
  const g = keys => keys.map(k => fieldInput(SHEET_FIELDS.find(f => f.key === k), c)).join("");
  const countyOpts = FL_COUNTIES.map(n => "<option" + (n === c.county ? " selected" : "") + ">" + esc(n) + "</option>").join("");
  const claimOpts = CLAIM_STATUSES.concat(c.claimStatus && !CLAIM_STATUSES.includes(c.claimStatus) ? [c.claimStatus] : [])
    .map(n => "<option" + (n === c.claimStatus ? " selected" : "") + ">" + esc(n) + "</option>").join("");
  const astatusList = Array.from(new Set(["Sold","Cancelled"].concat(state.cases.map(x => x.auctionStatus).filter(Boolean))))
    .map(v => "<option value=\"" + esc(v) + "\">").join("");
  const src = c.source || {};
  const rawRows = SHEET_FIELDS.filter(f => c.raw && c.raw[f.key] != null && c.raw[f.key] !== "")
    .map(f => "<dt>" + esc(f.label) + "</dt><dd>" + esc(c.raw[f.key]) + "</dd>").join("");
  const srcRows = [
    ["Source", src.type === "import" ? "Sheet import" : "Added manually"],
    ["File", src.fileName], ["Sheet tab", src.sheetName], ["Row", src.rowNumber],
    ["Imported", fmtDateTime(src.importedAt)], ["Record ID", c.id],
    ["Created", fmtDateTime(c.createdAt)], ["Updated", fmtDateTime(c.updatedAt)]
  ].filter(r => r[1] != null && r[1] !== "").map(r => "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>").join("");

  const html =
    "<header><h2>" + (isNew ? "Add case" : "Case " + esc(c.caseId)) + "</h2>" +
      (!isNew && isHttpUrl(c.caseIdUrl) ? "<a class=\"btn sm\" href=\"" + esc(c.caseIdUrl) + "\" target=\"_blank\" rel=\"noopener noreferrer\">Open clerk record ↗</a>" : "") +
      "<button class=\"btn ghost sm\" data-a=\"close\" aria-label=\"Close\">✕</button></header>" +
    "<div class=\"body\">" +
      "<datalist id=\"astatus-list\">" + astatusList + "</datalist>" +
      "<fieldset><legend>Tracking</legend><div class=\"fgrid\">" +
        "<label class=\"f\">Claim status<select id=\"e-claimStatus\">" + claimOpts + "</select></label>" +
        "<label class=\"f\">County<select id=\"e-county\">" + countyOpts + "</select></label>" +
      "</div>" + (isPlaintiff(c) ? "<p class=\"help\" style=\"margin:8px 0 0\">Plaintiff was the winning bidder. The Surplus figure is Winning Bid − Total Due, which usually overstates actual surplus on a plaintiff credit bid.</p>" : "") + "</fieldset>" +
      "<fieldset><legend>Sale</legend><div class=\"fgrid\">" + g(["saleDate","caseId","parcel","bidder","auctionStatus","certificateNumber","report","sequence"]) + "</div></fieldset>" +
      "<fieldset><legend>Amounts</legend><div class=\"fgrid\">" + g(["winningBid","deposit","auctionBalance","clerkFee","recFee","eaFee","poprFee","docStamps","totalDue","surplus"]) + "</div>" +
        "<p class=\"help\" style=\"margin:8px 0 0\">Leave Surplus blank to calculate it as Winning Bid − Total Due. <button class=\"btn sm\" type=\"button\" data-a=\"calc\">Recalculate now</button></p></fieldset>" +
      "<fieldset><legend>Links</legend><div class=\"fgrid\">" +
        linkFieldHTML("caseIdUrl", "Case ID link", c.caseIdUrl) +
        linkFieldHTML("winningBidUrl", "Winning Bid link", c.winningBidUrl) +
        linkFieldHTML("reportUrl", "Report link", c.reportUrl) +
      "</div></fieldset>" +
      "<fieldset><legend>Notes</legend>" +
        "<div class=\"addnote\"><textarea id=\"e-newnote\" rows=\"2\" placeholder=\"Add a note…\"></textarea><button class=\"btn\" type=\"button\" data-a=\"addnote\">Add</button></div>" +
        "<div class=\"help\" style=\"margin:4px 0 8px\">Notes are saved when you click Save.</div>" +
        "<div class=\"notes\" id=\"e-notes\">" + notesHTML(c) + "</div></fieldset>" +
      (isNew ? "" : "<details class=\"raw\"><summary>Source and original Sheet values</summary><dl class=\"kv\">" + srcRows + "</dl>" + (rawRows ? "<dl class=\"kv\" style=\"margin-top:10px\">" + rawRows + "</dl>" : "") + "</details>") +
      "<div class=\"err-text\" id=\"e-err\"></div>" +
    "</div>" +
    "<footer>" + (isNew ? "" : "<button class=\"btn danger left\" data-a=\"delete\">Delete case</button>") +
      "<button class=\"btn\" data-a=\"close\">Cancel</button><button class=\"btn primary\" data-a=\"save\">Save</button></footer>";

  const ov = openModal(html);
  const q = s => ov.querySelector(s);
  const rerenderNotes = () => { q("#e-notes").innerHTML = notesHTML(c); };
  syncLinkButtons(q);
  LINK_KEYS.forEach(k => q("#e-" + k).addEventListener("input", () => syncLinkButtons(q)));

  ov.addEventListener("click", async e => {
    const a = e.target.closest("[data-a]");
    const ne = e.target.closest("[data-nedit]");
    const nd = e.target.closest("[data-ndel]");
    if (ne){
      const n = c.notes.find(x => x.id === ne.dataset.nedit);
      const box = ne.closest(".note");
      box.querySelector(".ntext").innerHTML = "<textarea rows=\"3\"></textarea><div style=\"display:flex;gap:6px;margin-top:6px\"><button class=\"btn sm primary\" data-nsave=\"1\">Done</button><button class=\"btn sm\" data-ncancel=\"1\">Cancel</button></div>";
      const ta = box.querySelector("textarea"); ta.value = n.text; ta.focus();
      box.querySelector("[data-nsave]").onclick = ev => { ev.stopPropagation(); const t = ta.value.trim(); if (t && t !== n.text){ n.text = t; n.updatedAt = nowISO(); } rerenderNotes(); };
      box.querySelector("[data-ncancel]").onclick = ev => { ev.stopPropagation(); rerenderNotes(); };
      return;
    }
    if (nd){
      if (await confirmBox("Delete note?", "The note is removed when you save the case.", "Delete note", true)){
        c.notes = c.notes.filter(x => x.id !== nd.dataset.ndel); rerenderNotes();
      }
      return;
    }
    if (!a) return;
    const act = a.dataset.a;
    if (act === "close") closeModal(ov);
    else if (act === "calc"){
      const wb = parseMoney(q("#e-winningBid").value).cents, td = parseMoney(q("#e-totalDue").value).cents;
      if (wb != null && td != null) q("#e-surplus").value = centsToInput(wb - td);
      else q("#e-err").textContent = "Enter Winning Bid and Total Due first.";
    }
    else if (act === "addnote"){
      const t = q("#e-newnote").value.trim();
      if (!t) return;
      const ts = nowISO();
      c.notes.push({id:uuid(), text:t, createdAt:ts, updatedAt:ts});
      q("#e-newnote").value = ""; rerenderNotes();
    }
    else if (act === "delete"){
      if (!(await confirmBox("Delete this case?", "Case " + c.caseId + " and its notes will be permanently deleted.", "Delete case", true))) return;
      try { await state.store.deleteCase(c.id); closeModal(ov); toast("Case deleted"); await reload(); }
      catch(err){ toast(friendlyDataError(err), true); }
    }
    else if (act === "save"){
      const pending = q("#e-newnote").value.trim();
      if (pending){ const ts = nowISO(); c.notes.push({id:uuid(), text:pending, createdAt:ts, updatedAt:ts}); }
      const err = readForm(q, c);
      if (err){ q("#e-err").textContent = err; return; }
      const dupe = state.cases.find(x => x.id !== c.id && x.caseKey === c.caseKey);
      if (dupe){ q("#e-err").textContent = "Another case already has this County, Case ID and Sale Date."; return; }
      a.disabled = true;
      try { await state.store.saveCase(c); closeModal(ov); toast(isNew ? "Case added" : "Case saved"); await reload(); }
      catch(e2){ a.disabled = false; q("#e-err").textContent = friendlyDataError(e2); }
    }
  });
}

function readForm(q, c){
  const errs = [];
  for (const f of SHEET_FIELDS){
    const v = q("#e-" + f.key).value.trim();
    if (f.type === "money"){
      const p = parseMoney(v);
      if (p.error) errs.push(f.label + ": " + p.error);
      c[f.key] = p.cents;
    } else if (f.type === "number"){
      if (v === "") c[f.key] = null;
      else if (!isFinite(+v)) errs.push(f.label + " must be a number");
      else c[f.key] = +v;
    } else c[f.key] = v || (f.type === "date" ? null : "");
  }
  for (const k of LINK_KEYS){
    const v = q("#e-" + k).value.trim();
    if (v && !isHttpUrl(v)) errs.push("Links must start with http:// or https://");
    c[k] = v || null;
  }
  if (!c.caseId) errs.push("Case ID is required");
  if (!c.saleDate) errs.push("Sale Date is required");
  if (c.surplus == null && c.winningBid != null && c.totalDue != null) c.surplus = c.winningBid - c.totalDue;
  c.county = q("#e-county").value;
  c.claimStatus = q("#e-claimStatus").value;
  c.caseKey = caseKey(c.county, c.caseId, c.saleDate);
  c.updatedAt = nowISO();
  return errs.length ? Array.from(new Set(errs)).join(". ") + "." : null;
}

/* ============================================================
   IMPORT
   ============================================================ */
function openImport(){
  if (typeof XLSX === "undefined"){ toast("The spreadsheet reader (SheetJS) didn't load. Check your connection and reload the page.", true); return; }
  const imp = {fileName:"", wb:null, sheetName:"", county:"Miami-Dade", parsed:null, items:[], notes:[], noteItems:[], includeNotes:true};
  const countyOpts = FL_COUNTIES.map(n => "<option" + (n === imp.county ? " selected" : "") + ">" + esc(n) + "</option>").join("");
  const ov = openModal(
    "<header><h2>Import Google Sheet</h2><button class=\"btn ghost sm\" data-a=\"close\" aria-label=\"Close\">✕</button></header>" +
    "<div class=\"body\">" +
      "<div class=\"drop\" id=\"i-drop\"><p style=\"margin:0 0 8px\">In Google Sheets choose <b>File → Download → Microsoft Excel (.xlsx)</b>, then pick that file here.<br><span class=\"help\">A .xlsx keeps the Case ID and Winning Bid hyperlinks. CSV and copy/paste drop them.</span></p>" +
        "<input type=\"file\" id=\"i-file\" accept=\".xlsx,.xlsm,.xls\"></div>" +
      "<div id=\"i-setup\" class=\"hidden\"><div class=\"fgrid\">" +
        "<label class=\"f\">Sheet tab<select id=\"i-sheet\"></select></label>" +
        "<label class=\"f\">County for these cases<select id=\"i-county\">" + countyOpts + "</select></label>" +
      "</div></div>" +
      "<div id=\"i-result\"></div>" +
    "</div>" +
    "<footer><span class=\"help left\" id=\"i-foot\"></span><button class=\"btn\" data-a=\"close\">Cancel</button><button class=\"btn primary\" data-a=\"commit\" disabled>Import</button></footer>",
    "wide");
  const q = s => ov.querySelector(s);

  q("#i-file").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    imp.fileName = file.name;
    try {
      const buf = await file.arrayBuffer();
      imp.wb = XLSX.read(buf, {type:"array", cellFormula:true, cellNF:true, cellText:true, cellDates:false});
    } catch(err){
      q("#i-result").innerHTML = "<div class=\"err-text\">Couldn't read " + esc(file.name) + ". Make sure it's an Excel (.xlsx) file. Details: " + esc(err.message) + "</div>";
      return;
    }
    const ranked = rankSheets(imp.wb, XLSX);
    const cand = ranked.filter(s => s.hasRequired && !s.isNotes);
    if (!cand.length){
      q("#i-result").innerHTML = "<div class=\"err-text\">No tab in this file has both a <b>Sale Date</b> and a <b>Case ID</b> column header.</div>";
      return;
    }
    imp.sheetName = cand[0].name;
    q("#i-sheet").innerHTML = cand.map(s => "<option value=\"" + esc(s.name) + "\">" + esc(s.name) + " (" + s.score + " of " + SHEET_FIELDS.length + " columns)</option>").join("");
    const notesTab = ranked.find(s => s.isNotes);
    imp.notes = notesTab ? parseNotesSheet(imp.wb.Sheets[notesTab.name], XLSX) : [];
    imp.notesTab = notesTab ? notesTab.name : "";
    q("#i-setup").classList.remove("hidden");
    analyze();
  });
  q("#i-sheet").addEventListener("change", e => { imp.sheetName = e.target.value; analyze(); });
  q("#i-county").addEventListener("change", e => { imp.county = e.target.value; analyze(); });

  function analyze(){
    imp.parsed = parseCaseSheet(imp.wb.Sheets[imp.sheetName], XLSX);
    if (imp.parsed.error){ q("#i-result").innerHTML = "<div class=\"err-text\">" + esc(imp.parsed.error) + "</div>"; return; }
    imp.items = classifyRows(imp.parsed.rows, imp.county, state.cases);
    analyzeNotes();
    renderPreview();
  }

  // Notes match a case in this county by Case ID (existing cases or rows in this import)
  function analyzeNotes(){
    const countyLc = imp.county.toLowerCase();
    const targets = new Map();
    state.cases.filter(c => String(c.county).toLowerCase() === countyLc).forEach(c => {
      const k = normCaseId(c.caseId);
      if (!targets.has(k)) targets.set(k, []);
      targets.get(k).push({kind:"existing", c});
    });
    imp.items.filter(it => it.status !== "error").forEach(it => {
      const k = normCaseId(it.row.data.caseId);
      if (!targets.has(k)) targets.set(k, []);
      targets.get(k).push({kind:"row", it});
    });
    imp.noteItems = imp.notes.map(n => {
      const t = (targets.get(normCaseId(n.caseId)) || []);
      if (!t.length) return {n, status:"unmatched"};
      // A Case ID with several sale dates: attach to the most recent sale
      const pick = t.slice().sort((a, b) => String((b.c || b.it.row.data).saleDate).localeCompare(String((a.c || a.it.row.data).saleDate)))[0];
      const existingNotes = pick.kind === "existing" ? (pick.c.notes || []) : (pick.it.existing ? (pick.it.existing.notes || []) : []);
      if (n.legacyId && existingNotes.some(x => x.legacyId === n.legacyId)) return {n, status:"already", target:pick};
      return {n, status:"new", target:pick};
    });
  }

  function renderPreview(){
    const p = imp.parsed;
    const counts = {new:0, changed:0, same:0, error:0};
    imp.items.forEach(it => counts[it.status]++);
    const warnCount = imp.items.reduce((s, it) => s + (it.row.warnings.length ? 1 : 0), 0);
    const mapHTML = SHEET_FIELDS.map(f => "<span class=\"" + (p.mapping[f.key] == null ? "miss" : "") + "\">" + esc(f.label) + (p.mapping[f.key] == null ? " — not found" : "") + "</span>").join("") +
      p.extra.map(x => "<span class=\"extra\">" + esc(x) + " — ignored</span>").join("");
    const linkCount = imp.items.filter(it => it.row.data.caseIdUrl).length;
    const wbLinkCount = imp.items.filter(it => it.row.data.winningBidUrl).length;
    const nNew = imp.noteItems.filter(x => x.status === "new").length;
    const nAlready = imp.noteItems.filter(x => x.status === "already").length;
    const unmatched = imp.noteItems.filter(x => x.status === "unmatched");

    let html =
      (p.missingRequired.length ? "<div class=\"err-text\">Required column missing: " + esc(p.missingRequired.join(", ")) + "</div>" : "") +
      "<fieldset><legend>Column mapping (header row " + p.headerRow + ")</legend><div class=\"maplist\">" + mapHTML + "</div>" +
        "<p class=\"help\" style=\"margin:8px 0 0\">Hyperlinks found: Case ID " + linkCount + " of " + imp.items.length + ", Winning Bid " + wbLinkCount + " of " + imp.items.length + ".</p></fieldset>" +
      "<div class=\"summary\">" +
        "<span class=\"tag new\">" + counts.new + " new</span>" +
        "<span class=\"tag changed\">" + counts.changed + " changed</span>" +
        "<span class=\"tag same\">" + counts.same + " already imported (identical)</span>" +
        "<span class=\"tag error\">" + counts.error + " with errors</span>" +
        (warnCount ? "<span class=\"tag changed\">" + warnCount + " with warnings</span>" : "") +
        "<span style=\"flex:1\"></span>" +
        "<label class=\"help\"><input type=\"checkbox\" id=\"i-onlyissues\"> Show only rows needing attention</label>" +
        (counts.changed ? "<button class=\"btn sm\" data-a=\"allchanged\">Update all changed</button><button class=\"btn sm\" data-a=\"nochanged\">Skip all changed</button>" : "") +
      "</div>" +
      "<div class=\"prevwrap\"><table class=\"grid\"><thead><tr><th>Import?</th><th>Row</th><th>Result</th><th>Sale Date</th><th>Case ID</th><th>Bidder</th><th class=\"r\">Winning Bid</th><th class=\"r\">Total Due</th><th class=\"r\">Surplus</th><th>Status</th><th>Changes / issues</th></tr></thead><tbody id=\"i-rows\">" + previewRows(false) + "</tbody></table></div>";

    if (imp.notes.length){
      html += "<fieldset><legend>Notes tab \"" + esc(imp.notesTab) + "\"</legend>" +
        "<label><input type=\"checkbox\" id=\"i-notes\"" + (imp.includeNotes ? " checked" : "") + "> Import " + nNew + " new note" + (nNew === 1 ? "" : "s") + "</label>" +
        "<span class=\"help\"> · " + nAlready + " already imported · " + unmatched.length + " with no matching case</span>" +
        (unmatched.length ? "<div class=\"help\" style=\"margin-top:6px\">No matching case in " + esc(imp.county) + ": " + unmatched.map(u => "row " + u.n.rowNumber + " (Case ID " + esc(u.n.caseId || "blank") + ")").join(", ") + ". These are skipped.</div>" : "") +
        "<div class=\"help\" style=\"margin-top:6px\">Notes attach to cases that are already saved or included in this import.</div></fieldset>";
    }
    html += "<div id=\"i-progress\" class=\"progress hidden\"><div></div></div>";
    q("#i-result").innerHTML = html;
    q("#i-onlyissues").addEventListener("change", e => { q("#i-rows").innerHTML = previewRows(e.target.checked); });
    const nc = q("#i-notes"); if (nc) nc.addEventListener("change", e => { imp.includeNotes = e.target.checked; updateFoot(); });
    updateFoot();
  }

  function previewRows(onlyIssues){
    return imp.items.map((it, i) => {
      const r = it.row, d = r.data;
      if (onlyIssues && it.status === "new" && !r.warnings.length) return "";
      if (onlyIssues && it.status === "same") return "";
      const label = {new:"New", changed:"Changed", same:"Identical", error:"Error"}[it.status];
      const disabled = it.status === "error" || it.status === "same";
      const issues = r.errors.map(x => "<div class=\"e\">✕ " + esc(x) + "</div>").join("") + r.warnings.map(x => "<div class=\"w\">! " + esc(x) + "</div>").join("");
      const diff = it.status === "changed" ? "<div class=\"diff\">" + it.changed.map(k => {
        const f = SHEET_FIELDS.find(x => x.key === k);
        const lbl = f ? f.label : (k === "caseIdUrl" ? "Case ID link" : k === "winningBidUrl" ? "Winning Bid link" : "Report link");
        const fmt = v => v == null || v === "" ? "blank" : (f && f.type === "money" ? fmtMoney(v) : (f && f.type === "date" ? fmtDate(v) : String(v)));
        return esc(lbl) + ": " + esc(fmt(it.existing[k])) + " → " + esc(fmt(d[k]));
      }).join("<br>") + "</div>" : "";
      return "<tr>" +
        "<td><input type=\"checkbox\" data-inc=\"" + i + "\"" + (it.include ? " checked" : "") + (disabled ? " disabled" : "") + " aria-label=\"Import row " + r.rowNumber + "\"></td>" +
        "<td class=\"num\">" + r.rowNumber + "</td>" +
        "<td><span class=\"tag " + it.status + "\">" + label + "</span>" + (it.status === "changed" ? "<div class=\"help\">tick to update</div>" : "") + "</td>" +
        "<td>" + fmtDate(d.saleDate) + "</td>" +
        "<td>" + safeLink(d.caseIdUrl, d.caseId || r.raw.caseId) + "</td>" +
        "<td>" + esc(d.bidder) + "</td>" +
        "<td class=\"r num\">" + fmtMoney(d.winningBid) + "</td>" +
        "<td class=\"r num\">" + fmtMoney(d.totalDue) + "</td>" +
        "<td class=\"r num\">" + moneyCell(d.surplus) + "</td>" +
        "<td>" + statusTag(d.auctionStatus) + "</td>" +
        "<td>" + diff + "<div class=\"issues\">" + issues + "</div></td></tr>";
    }).join("");
  }

  function updateFoot(){
    const n = imp.items.filter(it => it.include).length;
    const nn = imp.includeNotes ? notesToWrite().length : 0;
    q("#i-foot").textContent = n + " case" + (n === 1 ? "" : "s") + (nn ? " and " + nn + " note" + (nn === 1 ? "" : "s") : "") + " will be written.";
    q("[data-a=commit]").disabled = !(n || nn);
  }
  // Only notes whose target will exist after this import
  function notesToWrite(){
    return imp.noteItems.filter(x => x.status === "new" && (x.target.kind === "existing" || x.target.it.include || !!x.target.it.existing));
  }

  ov.addEventListener("change", e => {
    const cb = e.target.closest("[data-inc]");
    if (cb){ imp.items[+cb.dataset.inc].include = cb.checked; updateFoot(); }
  });

  ov.addEventListener("click", async e => {
    const a = e.target.closest("[data-a]");
    if (!a) return;
    if (a.dataset.a === "close"){ if (!ov.dataset.busy) closeModal(ov); return; }
    if (a.dataset.a === "allchanged" || a.dataset.a === "nochanged"){
      imp.items.forEach(it => { if (it.status === "changed") it.include = a.dataset.a === "allchanged"; });
      q("#i-rows").innerHTML = previewRows(q("#i-onlyissues").checked); updateFoot(); return;
    }
    if (a.dataset.a === "commit") await commitImport(a);
  });

  async function commitImport(btn){
    const batchId = uuid();
    const ts = nowISO();
    const docs = new Map(); // case id → full case object to write
    const source = (r) => ({type:"import", importBatchId:batchId, fileName:imp.fileName, sheetName:imp.sheetName, rowNumber:r.rowNumber, importedAt:ts});
    let added = 0, updated = 0;
    imp.items.filter(it => it.include).forEach(it => {
      const d = it.row.data;
      if (it.status === "new"){
        const c = Object.assign(blankCase(), d, {county:imp.county, raw:it.row.raw, source:source(it.row), createdAt:ts, updatedAt:ts});
        c.caseKey = caseKey(c.county, c.caseId, c.saleDate);
        it.newId = c.id; docs.set(c.id, c); added++;
      } else if (it.status === "changed"){
        const c = JSON.parse(JSON.stringify(it.existing));
        COMPARE_KEYS.forEach(k => { c[k] = d[k] == null ? (typeof c[k] === "string" ? "" : null) : d[k]; });
        c.raw = it.row.raw; c.source = source(it.row); c.updatedAt = ts;
        c.caseKey = caseKey(c.county, c.caseId, c.saleDate);
        docs.set(c.id, c); updated++;
      }
    });
    let notesAdded = 0;
    if (imp.includeNotes){
      notesToWrite().forEach(x => {
        let c;
        if (x.target.kind === "existing") c = docs.get(x.target.c.id) || JSON.parse(JSON.stringify(x.target.c));
        else if (x.target.it.newId) c = docs.get(x.target.it.newId);
        else c = docs.get(x.target.it.existing.id) || JSON.parse(JSON.stringify(x.target.it.existing));
        if (!c) return;
        c.notes = c.notes || [];
        c.notes.push({id:uuid(), legacyId:x.n.legacyId || null, text:x.n.text, createdAt:x.n.createdAt || ts, updatedAt:x.n.updatedAt || x.n.createdAt || ts, importBatchId:batchId});
        c.updatedAt = ts;
        docs.set(c.id, c); notesAdded++;
      });
    }
    const counts = imp.items.reduce((m, it) => { m[it.status] = (m[it.status] || 0) + 1; return m; }, {});
    const ops = Array.from(docs.values()).map(c => ({coll:"cases", id:c.id, data:c}));
    ops.push({coll:"importBatches", id:batchId, data:{
      id:batchId, fileName:imp.fileName, sheetName:imp.sheetName, county:imp.county, importedAt:ts,
      rowsRead:imp.items.length, added, updated, notesAdded,
      skippedIdentical:counts.same || 0, skippedErrors:counts.error || 0,
      skippedChanged:imp.items.filter(it => it.status === "changed" && !it.include).length,
      errors:imp.items.filter(it => it.status === "error").map(it => ({rowNumber:it.row.rowNumber, errors:it.row.errors}))
    }});

    ov.dataset.busy = "1"; btn.disabled = true;
    const bar = q("#i-progress"); bar.classList.remove("hidden");
    try {
      await state.store.commit(ops, (done, total) => { bar.firstChild.style.width = Math.round(done / total * 100) + "%"; });
      delete ov.dataset.busy;
      closeModal(ov);
      toast("Imported: " + added + " new, " + updated + " updated" + (notesAdded ? ", " + notesAdded + " notes" : "") + ".");
      await reload();
    } catch(err){
      delete ov.dataset.busy; btn.disabled = false;
      toast("Import failed: " + friendlyDataError(err) + " Some batches may have saved; re-open Import with the same file to see what's left.", true);
      await reload();
    }
  }
}

/* ============================================================
   WIRING
   ============================================================ */
function bindFilters(){
  const map = [["#f-search","search","input"],["#f-county","county","change"],["#f-astatus","astatus","change"],["#f-cstatus","cstatus","change"],
               ["#f-from","from","change"],["#f-to","to","change"],["#f-minsurplus","minSurplus","input"],["#f-bidder","bidder","change"]];
  map.forEach(([sel, key, ev]) => $(sel).addEventListener(ev, e => { state.filters[key] = e.target.value; renderList(); }));
  $("#f-clear").onclick = () => {
    Object.keys(state.filters).forEach(k => { state.filters[k] = ""; });
    map.forEach(([sel]) => { $(sel).value = ""; });
    renderList();
  };
  const setView = v => { state.view = v; try { localStorage.setItem("sft-view", v); } catch(e) {} renderList(); };
  $("#v-table").onclick = () => setView("table");
  $("#v-cards").onclick = () => setView("cards");
  $("#add-btn").onclick = () => openCase(null);
  $("#import-btn").onclick = openImport;
  $("#signout-btn").onclick = () => state.store.signOut();
}

function showAuth(msg, isErr){
  $("#app-view").classList.add("hidden");
  $("#auth-view").classList.remove("hidden");
  $("#auth-msg").textContent = msg || "";
  $("#auth-msg").className = "auth-msg" + (msg ? (isErr ? " err" : " ok") : "");
}

async function boot(){
  $("#ver-chip").textContent = APP_VERSION;
  if (DEMO){ $("#demo-banner").classList.remove("hidden"); $("#demo-chip").classList.remove("hidden"); }
  try {
    state.store = DEMO ? makeDemoStore() : await makeFirebaseStore();
  } catch(e){
    showAuth("Couldn't load Firebase. Check your connection and the firebaseConfig block. Details: " + e.message, true);
    $("#login-btn").disabled = true;
    return;
  }
  bindFilters();
  $("#login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("#login-btn"); btn.disabled = true;
    $("#auth-msg").textContent = "Signing in…"; $("#auth-msg").className = "auth-msg";
    try { await state.store.signIn($("#login-email").value.trim(), $("#login-password").value); }
    catch(err){ showAuth(friendlyAuthError(err), true); }
    finally { btn.disabled = false; }
  });
  $("#reset-btn").addEventListener("click", async () => {
    const email = $("#login-email").value.trim();
    if (!email){ showAuth("Enter your email above, then click Forgot password.", true); return; }
    try { await state.store.resetPassword(email); showAuth("If that account exists, a reset link is on its way to " + email + ".", false); }
    catch(err){ showAuth(friendlyAuthError(err), true); }
  });
  state.store.onAuth(async user => {
    state.user = user;
    if (!user){ state.cases = []; showAuth(""); return; }
    $("#login-password").value = "";
    $("#who").textContent = user.email || "";
    $("#auth-view").classList.add("hidden");
    $("#app-view").classList.remove("hidden");
    await reload();
  });
}
boot();
</script>
