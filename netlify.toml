# Surplus Funds Tracker — Netlify config
# Current release: index-v0.2.0.html (previous versions stay in the repo for rollback)
[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/index-v0.2.0.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
